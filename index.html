<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf6ef" />
    <meta name="description" content="A simple checklist for shopping and event to-dos." />
    <title>My Checklist</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__row">
        <div class="topbar__text">
          <h1 class="topbar__title">My Checklist</h1>
          <p class="topbar__sub">Tap an item to tick it off</p>
        </div>
        <button class="iconbtn" id="menuButton" type="button" aria-label="More options" aria-haspopup="dialog">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" focusable="false">
              <circle cx="5" cy="12" r="1.9" />
              <circle cx="12" cy="12" r="1.9" />
              <circle cx="19" cy="12" r="1.9" />
            </svg>
          </span>
        </button>
      </div>
      <div class="chips" id="listChips" role="tablist" aria-label="Lists"></div>
    </header>

    <main class="main" id="main"></main>

    <div class="actionbar">
      <div class="actionbar__inner">
        <button class="btn btn--primary" id="addItemButton" type="button">+ Add item</button>
        <button class="btn btn--secondary" id="addCategoryButton" type="button">+ Category</button>
      </div>
    </div>

    <div class="scrim" id="scrim" hidden></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
      <div class="sheet__grip" aria-hidden="true"></div>
      <div class="sheet__head">
        <h2 class="sheet__title" id="sheetTitle"></h2>
        <button class="iconbtn iconbtn--sm" id="sheetClose" type="button" aria-label="Close">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" focusable="false">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </span>
        </button>
      </div>
      <div class="sheet__body" id="sheetBody"></div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="fileInput" accept="application/json,.json" hidden />
    <script src="app.js"></script>
  </body>
</html>
